# Stages classifier yml for bbreww
variables:
  CLASSIFIER_WFS: "bbreww/classifier/test/config/workflow/CI"

code_classifier_dependencies_bbreww:
  stage: classifier
  extends: .base_analysis_bbreww
  variables:
    CLASSIFIER_CONFIG_PATHS: "bbreww"
  script:
    - python -m src.classifier.test.check_configs

code_classifier_models_bbreww:
  stage: classifier
  extends: .base_analysis_bbreww
  script:
    - python bbreww/classifier/test_models.py

generate_dataset_bbreww:
  stage: classifier
  extends: .base_analysis_bbreww
  variables:
    CLASSIFIER_CONFIG_PATHS: "bbreww"
  needs:
    - setup_bbreww
  script:
    - if [ "$(basename $(pwd))" = "barista_framework" ]; then mkdir -p ../output && ln -s ../output output || true; fi
    - python -m src.classifier.task.main from ${CLASSIFIER_WFS}/generate_dataset.yml ${CLASSIFIER_WFS}/common.yml
  artifacts:
    paths:
      - output/dataset/sparse.root
      - output/dataset/dense.root

cache_bbreww:
  stage: classifier
  extends: .base_analysis_bbreww
  variables:
    CLASSIFIER_CONFIG_PATHS: "bbreww"
  needs:
    - setup_bbreww
    - generate_dataset_bbreww
  script:
    - if [ "$(basename $(pwd))" = "barista_framework" ]; then mkdir -p ../output && ln -s ../output output || true; fi
    - python -m src.classifier.task.main from ${CLASSIFIER_WFS}/main_cache.yml ${CLASSIFIER_WFS}/common.yml
    - python -m src.classifier.task.main from ${CLASSIFIER_WFS}/main_cache_compare.yml ${CLASSIFIER_WFS}/common.yml
  artifacts:
    paths:
      - output/main_cache/diagnostics/logs.html

train_bbreww:
  stage: classifier
  extends: .base_analysis_bbreww
  variables:
    CLASSIFIER_CONFIG_PATHS: "bbreww"
  needs:
    - setup_bbreww
    - generate_dataset_bbreww
  script:
    - if [ "$(basename $(pwd))" = "barista_framework" ]; then mkdir -p ../output && ln -s ../output output || true; fi
    - python -m src.classifier.task.main from ${CLASSIFIER_WFS}/main_train.yml ${CLASSIFIER_WFS}/common.yml
  artifacts:
    paths:
      - output/main_train/result.json
      - output/main_train/states.pkl
      - output/main_train/model_test-SvD__*.pkl
      - output/main_train/diagnostics/logs.html
      - output/main_train/report/

evaluate_bbreww:
  stage: classifier
  extends: .base_analysis_bbreww
  variables:
    CLASSIFIER_CONFIG_PATHS: "bbreww"
  needs:
    - setup_bbreww
    - generate_dataset_bbreww
    - train_bbreww
  script:
    - if [ "$(basename $(pwd))" = "barista_framework" ]; then mkdir -p ../output && ln -s ../output output || true; fi
    - python -m src.classifier.task.main from ${CLASSIFIER_WFS}/main_evaluate.yml ${CLASSIFIER_WFS}/common.yml || (cat output/main_train/result.json && python -c "import os; [print(os.path.join(r, f)) for r, d, fs in os.walk('output') for f in fs]" && python -c "import uproot, glob; [print(f, len(uproot.open(f)['Events'])) for f in glob.glob('output/main_evaluate/chunks/*.root')]" && python -c "import uproot; t = uproot.open('output/main_evaluate/chunks/test-SvD_dense.root')['Events']; print(t.keys()); [print(k, t[k].array()) for k in t.keys()]" && exit 1)
  artifacts:
    paths:
      - output/main_evaluate/diagnostics/logs.html
      - output/main_evaluate/chunks/*.root
