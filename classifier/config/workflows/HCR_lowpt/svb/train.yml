# template:
# - model: path to model

# when run with
#   template/-template "model: path/to/model" path/to/this/file.yml
# the {model} will be replaced by path/to/model

main:
  module: train # run training task
  option:
    - --max-loaders 2
    - --max-trainers 3

dataset:
  - module: bbWW.svb.Background
    option:
      - --mc-processes ttbar
      - --metadata bbreww/metadata/classifier/datasets/datasets_v5
      - --norm 4 #set TTbar to be 4 times weight of signal
      # - --ttbar-prescale 10 # this option is to only train on a fraction of events
      - --friends "" bbreww/metadata/classifier/input/output_friend_lowpt.json@@classifier_input_lowpt # set input friend tree
    
  - module: bbWW.svb.Background
    option:
      - --mc-processes WplusJets tW
      - --metadata bbreww/metadata/classifier/datasets/datasets_minor_bkgs_v5
      - --norm 2
      - --friends "" bbreww/metadata/classifier/input/minorbkg_friend_lowpt.json@@classifier_input_lowpt # set input friend tree

  - module: bbWW.svb.Signal
    option:
      - --metadata bbreww/metadata/classifier/datasets/datasets_v5
      - --friends "" bbreww/metadata/classifier/input/output_friend_lowpt.json@@classifier_input_lowpt # set input friend tree
      #- --train-bsm

model:
  - module: bbWW.HCR_lowpt.baseline_svb.Train # use the baseline bbWW HCR model
    option:
      - --kfolds 3 # use 3-fold
      - --kfold-seed FvT random # setup base seed to be ("FvT", "random")
      - --kfold-seed-offsets 0 # use seed ("FvT", "random", 0)
      # --kfold-seed-offsets 0-14 will use seed ("FvT", "random", 0), ... ("FvT", "random", 14) to train 15 models
      - --training FixedStep # setup training schedule
      # FixedStep is defined in config/scheduler
      - epoch: 20 # setup kwargs for FixedStep
        bs_init: 2048

setting:
  - module: IO # setup output directory
    option:
      - output: "{model}" # will be replaced by the template
