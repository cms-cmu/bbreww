flag:
  - test
  - debug

setting:
  - module: cms.CollisionData
    option:
      - years: ["2016", "2017", "2018"]

  - module: bbWW.InputBranch
    option:
      - nnonbJetCand: 2
        feature_nonbJetCand: ["pt", "eta", "phi", "mass", "attn_score"]
        feature_ancillary: ["njets", "nsoftjets", "HT", "year"]

  - module: monitor.Log
    option:
      - forward_exception: false
      - exit_on_exception: true

  - module: monitor.Monitor
    option:
      - enable: false

  - module: test.Randomness
    option:
      - seed: 0
        n_threads: 1
        deterministic_algorithm: true

  - module: ml.DataLoader
    option:
      - num_workers: 0

  - module: Multiprocessing
    option:
      - context_library: builtins
        preload: []

  - module: Analysis
    option:
      - max_workers: 1
