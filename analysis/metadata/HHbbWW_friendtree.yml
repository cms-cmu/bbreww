runner:
  max_workers: 400 
  skipbadfiles: False
  workers: 6
  friend_merge_step: 100000
  worker_memory: 10GB
  data_tier: picoAOD
  condor_cores: 1
  #friend_base: &friend_base root://cmseos.fnal.gov//store/user/akhanal/HHbbWW/2025_v5/
  spanet_base: &spanet_base root://cmseos.fnal.gov//store/user/akhanal/HHbbWW/2025_v5/spanet_output
  #friend_base: &friend_base output/test/
  condor_transfer_input_files:
    - src/
    - bbreww/analysis/
    - bbreww/metadata/

  allowlist_sites:
    - T3_US_CMU
    - T3_US_FNALLPC
    - T2_US_Nebraska
    - T3_US_NotreDame
    - T3_US_Rutgers
    - T2_US_Caltech
    - T1_US_FNAL_Disk
    - T2_US_MIT
    - T2_US_Purdue


config:
  make_spanet_input: *spanet_base
  #make_classifier_input: *friend_base
  run_MET_regression: false
  friends:
    met_regressor: "bbreww/metadata/regressor/output/result.json@@analysis.0.merged"
  fill_hists: false     
  run_SvB: false