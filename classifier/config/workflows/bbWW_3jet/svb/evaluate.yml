# template:
# - model: path to model
# - SvB: path to output friend tree

main:
  module: evaluate
  option:
    - --max-evaluators 3

dataset:
  - module: bbWW.svb.Eval
    option:
      - --metadata bbreww/metadata/classifier/datasets/datasets_v5
      - --max-workers 4
      - --mc-processes GluGluToHHTo2B2VLNu2J ttbar
      - --friends "" bbreww/metadata/classifier/input/output_friend.json@@classifier_input
  - module: bbWW.svb.Eval
    option:
      - --metadata bbreww/metadata/classifier/datasets/datasets_minor_bkgs_v5
      - --max-workers 4
      - --mc-processes WplusJets tW singleTop
      - --friends "" bbreww/metadata/classifier/input/minorbkg_friend.json@@classifier_input
  - module: bbWW.svb.DataEval
    option:
      - --no-SR
      - --data-source detector
      - --metadata bbreww/metadata/classifier/datasets/datasets_data_v5
      - --max-workers 4
      - --friends "" bbreww/metadata/classifier/input/data_friend.json@@classifier_input

model:
  - module: bbWW.bbWW_3jet.baseline_svb_3jet.Eval
    option:
      - --models
      - Final
      - "{model}/result.json"

analysis:
  - module: kfold.Merge
    option:
      - --name svb
      - --step 100000
      - --workers 5
      - --clean

setting:
  - module: IO
    option:
      - output: "{SvB}"
  - module: ml.DataLoader
    option:
      - num_workers: 0
      - batch_eval: 1048576 # 2^20
