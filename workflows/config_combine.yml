# bbWW combine workflow configuration
# Pass to snakemake with: --configfile bbreww/workflows/config_combine.yml

coffea_wrapper:  "./run_container "          # coffea container (step 1)
combine_wrapper: "./run_container combine "  # combine container (steps 2-5)
output_path: "output/combine"

# Input coffea file
input_coffea: "output/full_run/output_merged.coffea"

# Common settings
rebin: 1

# Axis collapsing at the convert step (applied to both categories)
sum_axes: "region"

# ── nominal 4j2b category ─────────────────────────────────────────────────────
nominal_collection:  "hists_4j2b"
nominal_histos:      "SvB.phh_variable_nominal"
nominal_variable:    "SvB.phh_variable_nominal"
nominal_select_axes: "nominal_4j2b=True"

# ── lowpt 4j2b category ───────────────────────────────────────────────────────
lowpt_collection:    "hists"
lowpt_histos:        "SvB.phh_variable_lowpt"
lowpt_variable:      "SvB.phh_variable_lowpt"
lowpt_select_axes:   "lowpt_4j2b=True"
