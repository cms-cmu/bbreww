runner:
  chunksize: 10000
  maxchunks: 50
  skipbadfiles: False
  workers: 8
  worker_memory: 12GB
  data_tier: picoAOD
  condor_cores: 1
  condor_transfer_input_files:
    - src/
    - bbreww/analysis/
    - bbreww/metadata/
    
  # rucio_regex_sites: 'T[123]_(US|CH|DE|UK)'
  allowlist_sites:
    - T3_US_CMU
    - T3_US_FNALLPC
    - T2_US_Nebraska
    #- T3_US_NotreDame
    - T3_US_Rutgers
    - T2_US_Caltech
    #- T1_US_FNAL_Disk
    - T2_US_MIT
    - T2_US_Purdue

# processor specific flags below
config:
  dump_signal_phh: false
  run_SvB: false
  run_MET_regression: true
  friends:
    SvB: "bbreww/metadata/classifier/output/result.json@@analysis.0.merged"
    met_regressor: "bbreww/metadata/regressor/output/result.json@@analysis.0.merged"
